spring.application.name=projekt-inzynierski

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=siem-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.mateusz.projektinzynierski.model
spring.kafka.consumer.properties.spring.json.value.default.type=pl.mateusz.projektinzynierski.model.SecurityEvent
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:postgresql://localhost:5434/siem
spring.datasource.username=mateusz
spring.datasource.password=mateusz
spring.jpa.hibernate.ddl-auto=update